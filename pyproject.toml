[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "figma-svg-to-pdf"
version = "0.1.1"
description = "Convert large Figma SVG exports to a single-page PDF locally, with text and link verification."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "storywriter"}]
dependencies = [
  "vl-convert-python==1.9.0.post1",
  "fonttools==4.66.1",
  "uharfbuzz==0.56.2",
  "pypdf==6.10.0",
  "reportlab==4.4.9",
  "Pillow==12.3.0",
  "svgpathtools==1.8.0",
  "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
figma-svg-to-pdf = "figma_svg_to_pdf.cli:main"

[project.urls]
Homepage = "https://github.com/storywriter/figma-svg-to-pdf"
Issues = "https://github.com/storywriter/figma-svg-to-pdf/issues"

[tool.setuptools.package-data]
figma_svg_to_pdf = ["font_manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
